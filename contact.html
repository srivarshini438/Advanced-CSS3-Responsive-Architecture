<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Sri Varshini for web development and project opportunities.">

    <meta name="author"
          content="Sri Varshini">

    <meta name="robots"
          content="index, follow">

    <title>Contact | Sri Varshini</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <nav aria-label="Main navigation">

            <a href="index.html" class="logo">
                Portfolio
            </a>

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="contact.html"
                       aria-current="page">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- THEME BUTTON -->

            <button
                id="theme-toggle"
                type="button"
                aria-label="Toggle dark mode">

                🌙 Dark Mode

            </button>

        </nav>

    </header>


    <!-- MAIN -->

    <main>

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">
                Contact Me
            </h1>

            <p>
                Have a question or project opportunity?
                Feel free to contact me.
            </p>


            <form action="#"
                  method="post"
                  aria-label="Contact form">


                <div>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>

                </div>


                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>

                </div>


                <div>

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required>

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 Sri Varshini. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
